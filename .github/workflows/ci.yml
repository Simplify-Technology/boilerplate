name: CI

# Sem paths-ignore de propósito: com required checks no branch protection,
# PR só-docs ficaria preso em "waiting for status" para sempre; o custo de
# rodar o CI em mudança de markdown é menor que esse risco.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------
  # Frontend pipeline
  # -----------------------
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 24 ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Cache Vite dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Type check
        run: pnpm -s run types

      - name: Lint
        run: pnpm -s run lint

      - name: Format check
        run: pnpm -s run format:check

      - name: Unit tests
        run: pnpm -s run ci:test
        env:
          CI: true

      - name: Build
        run: pnpm -s run build

  # -----------------------
  # Backend pipeline
  # -----------------------
  backend:
    name: Backend (PHP ${{ matrix.php }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        php: [ 8.4 ]
        node: [ 24 ]

    # A suíte roda em SQLite :memory: (phpunit.xml). O MySQL existe só para o gate
    # de migrations abaixo — pega migration incompatível com MySQL que o SQLite
    # deixa passar (produção é MySQL).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: boilerplate_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate Composer config
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build frontend assets
        run: pnpm -s run build

      - run: cp .env.example .env
      - run: php artisan key:generate

      # Gate SQLite×MySQL: só as migrations, não a suíte.
      - name: Migrations (MySQL 8)
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: boilerplate_ci
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Tests (Pest)
        run: ./vendor/bin/pest

  # -----------------------
  # Code quality
  # -----------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.4
          extensions: sqlite, pdo_sqlite

      - name: Validate Composer config
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - run: composer install -q --no-interaction --prefer-dist

      - name: Run Pint (check only)
        run: vendor/bin/pint --test

      - name: Run PHPStan (larastan)
        run: composer ci:stan

  # -----------------------
  # Security audit
  # -----------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      # Ambos os audits leem apenas os lockfiles — não é preciso instalar dependências.
      # composer audit falha em QUALQUER advisory (exit != 0 por padrão).
      # --locked audita o composer.lock direto — o job não roda composer install.
      - name: Composer audit
        run: composer audit --locked

      # Só high/critical em deps de produção bloqueiam o PR (medium/low não travam).
      - name: pnpm audit (prod, high/critical)
        run: pnpm audit --prod --audit-level high

  # -----------------------
  # Rector (opcional, não bloqueia)
  # -----------------------
  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.4

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Rector dry-run
        run: ./vendor/bin/rector process --dry-run --config ./rector.php
