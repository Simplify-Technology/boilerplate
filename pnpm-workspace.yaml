# Build scripts permitidos (pnpm 11 substituiu `onlyBuiltDependencies` por `allowBuilds`).
allowBuilds:
  esbuild: true

# Proteção supply-chain do pnpm: só RESOLVE versões publicadas há ≥7 dias
# (pnpm add/update). Não afeta os installs do CI e do deploy, que usam
# --frozen-lockfile. A janela de 7 dias cobre o padrão dos ataques a pacotes
# npm (comprometidos e despublicados em dias).
# Para uma correção urgente de versão recém-lançada, use:
#   pnpm add pacote@x.y.z --config.minimum-release-age=0
minimumReleaseAge: 10080
